name: literate tangle check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tangle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify tangled regions match their literate sources
        run: python3 literate/tangle.py check
